worker_processes auto;
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_body_temp_path /tmp/client_body;

    server {
        listen 80;
        server_name _;
        root /var/www/website;
        index index.html;

        # Páginas geradas no build (prerender) → HTML com meta único.
        # Rotas desconhecidas → 404 real (não a home).
        error_page 404 /404.html;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Tokens dinâmicos de cadastro (SPA)
        location ^~ /completar-cadastro/ {
            try_files $uri $uri/ /completar-cadastro/index.html /index.html;
        }

        location = /404.html {
            internal;
        }

        location / {
            try_files $uri $uri/index.html =404;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    }
}
